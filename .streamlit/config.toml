[theme]
font = "sans-serif"

[theme.light]
primaryColor = "#087959"
backgroundColor = "#FAFBF8"
secondaryBackgroundColor = "#EDF3EF"
textColor = "#1A342C"
borderColor = "#D8E3DC"

[theme.dark]
primaryColor = "#62DFAF"
backgroundColor = "#10201C"
secondaryBackgroundColor = "#1A302A"
